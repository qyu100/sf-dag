[package]
name = "primary"
version = "0.1.0"
authors = ["Libra <oncall+libra@xmail.facebook.com>"]
publish = false
edition = "2018"

[dependencies]
futures = "0.3.6"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.5.0", features = ["sync", "rt", "macros"] }
tokio-util = { version = "0.6.2", features= ["codec"] }
ed25519-dalek = "1.0.1"
thiserror = "1.0.20"
bincode = "1.3.1"
bytes = "1.0.1"
env_logger = "0.7.1"
log = "0.4.11"
async-recursion = "0.3.2"
async-trait = "0.1.50"
tiny-keccak = { version = "2.0.1", features = ["sha3"]}
byteorder = "1.3.2"
rayon = "1.7"
blake3 = "1.4"

crypto = { path = "../crypto" }
store = { path = "../store" }
config = { path = "../config" }
network = { path = "../network" }
reed-solomon-simd = "3.1"
rs_merkle = "1.4.2"
hex_fmt = "0.3.0"

[dev-dependencies]
rand = "0.7.3"

[features]
benchmark = []
